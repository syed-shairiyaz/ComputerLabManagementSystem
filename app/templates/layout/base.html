<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{% block title %}CLMS{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="{{ url_for('main.admin_dashboard') }}">

            💻 CLMS

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.admin_dashboard') }}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('student.students') }}">
                        Students
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('teacher.teachers') }}">
                        Teachers
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('attendance.attendance_list') }}">
                      Attendance
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('attendance.attendance_report') }}">
                      Reports
                    </a>
                </li>

                <li class="nav-item">

                    <a class="nav-link"
                    href="{{ url_for('announcement.announcements') }}">

                     📢 Announcements

                    </a>

                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.working_days') }}">
                     📅 Working Days
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('computer.computers') }}">
                       Systems
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('student.search_student') }}">
                      Search Student
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.admin_settings') }}">
                     ⚙️ Settings
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('main.logout') }}">
                      Logout
                    </a>
                </li>
         
            </ul>
        </div>
    
    
    </div>

</nav>

<div class="container-fluid mt-4">

{% block content %}

{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
