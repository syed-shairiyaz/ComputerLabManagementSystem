{% extends "layout/base.html" %}

{% block title %}
CLMS - Home
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-lg">

            <div class="card-body text-center p-5">

                <!-- Logo / Title -->

                <h1 class="mb-3">
                    💻 CLMS
                </h1>

                <h4 class="mb-3">
                    Computer Lab Management System
                </h4>

                <p class="text-muted">
                    Student Attendance & Lab Management
                </p>

                <hr class="my-4">


                <!-- STUDENT LOGIN -->

                <a
                    href="{{ url_for('main.student_login') }}"
                    class="btn btn-success btn-lg w-100 mb-3">

                    🎓 Student Login

                </a>


                <!-- SEARCH STUDENT -->

                <a
                    href="{{ url_for('student.search_student') }}"
                    class="btn btn-outline-primary btn-lg w-100 mb-4">

                    🔍 Search Student

                </a>


                <hr>


                <!-- ADMIN -->

                <p class="text-muted small mb-2">
                    Administration
                </p>

                <a
                    href="{{ url_for('main.admin_login') }}"
                    class="btn btn-dark">

                    🔐 Admin

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
