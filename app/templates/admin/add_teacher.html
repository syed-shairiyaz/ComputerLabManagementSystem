{% extends "layout/base.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}

<div class="container">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Teacher</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Department</label>

<input
type="text"
name="department"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

<option>Active</option>

<option>Inactive</option>

</select>

</div>

<button class="btn btn-success">

Save Teacher

</button>

<a href="/admin/teachers"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
