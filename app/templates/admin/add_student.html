{% extends "layout/base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                ➕ Add Student
            </h3>

        </div>


        <div class="card-body">

            <form method="POST">


                <!-- Student ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input
                        type="text"
                        name="student_id"
                        class="form-control"
                        placeholder="Example: 23B91A0501"
                        required>

                </div>


                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter student name"
                        required>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>


                <!-- Year -->

                <div class="mb-3">

                    <label class="form-label">
                        Year
                    </label>

                    <select
                        name="year"
                        class="form-select"
                        required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- Branch -->

                <div class="mb-3">

                    <label class="form-label">
                        Branch
                    </label>

                    <select
                        name="branch"
                        class="form-select"
                        required>

                        <option value="">
                            Select Branch
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="CSE-DS">
                            CSE-DS
                        </option>

                        <option value="CSE-CS">
                            CSE-CS
                        </option>

                        <option value="ALML">
                            ALML
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                    </select>

                </div>


                <!-- Section -->

                <div class="mb-3">

                    <label class="form-label">
                        Section
                    </label>

                    <select
                        name="section"
                        class="form-select"
                        required>

                        <option value="">
                            Select Section
                        </option>

                        <option value="A">
                            A
                        </option>

                        <option value="B">
                            B
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="D">
                            D
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <button
                    type="submit"
                    class="btn btn-success">

                    💾 Save Student

                </button>


                <a
                    href="{{ url_for('student.students') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
